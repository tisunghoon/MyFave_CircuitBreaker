# 실습 전용 프로파일 — 자원 축소 + 빠졌던 메트릭 배선.
# 실행: SPRING_PROFILES_ACTIVE=local,chaos ./gradlew bootRun
#   local : DB/Redis/OAuth 등 실제 인프라 설정(application-local.yml)
#   chaos : 아래 자원 축소 + 장애 주입 빈(@Profile("chaos")) 활성화
spring:
  datasource:
    hikari:
      maximum-pool-size: 10        # 원본 장애 풀 크기 10 — 빠른 포화 관측
      pool-name: myfave-hikari

server:
  tomcat:
    threads:
      max: 20                      # 워커 스레드 상한. 결제가 다 먹으면 읽기 경로가 먼저 죽는다
    mbeanregistry:
      enabled: true                # tomcat_threads_busy_threads / _config_max_threads 노출

# 드릴 편의 — 액세스 토큰 만료를 24시간으로 늘려 장시간 부하 중 토큰 만료(401)를 방지
jwt:
  access-token-expiry: 86400000   # 24h (기본 30분 → 드릴 중 재발급 불필요)

# 장애 주입 스위치 기본값 (부하 중 ChaosController로 런타임 토글)
chaos:
  pg:
    enabled: false                 # 시작은 정상. POST /internal/chaos/pg 로 ON
    latency-ms: 8000               # 느린 성공 지연(ms) — 원본 8초
    mode: SLOW200                  # SLOW200=느린 HTTP 200 / ERROR=예외

# ── 빠졌던 모니터링 배선(핵심) ─────────────────────────────
# _bucket 계열 메트릭은 히스토그램을 켜야 나온다. 안 켜면 4막 p99 쿼리가 빈값.
management:
  metrics:
    distribution:
      percentiles-histogram:
        hikaricp.connections.usage: true       # 4막: 커넥션 점유 시간 p99 (이 사건의 신호)
        hikaricp.connections.acquire: true     # 4막: 커넥션 대기 시간 p99
        resilience4j.circuitbreaker.calls: true # 2막에서 r4j 추가 시 자동으로 _bucket 생성

# [3막] 서킷 설정을 우리 SLO 기준으로 — 8초 느린 성공이 서킷을 열도록 임계 조정
resilience4j:
  circuitbreaker:
    instances:
      pgClient:
        slidingWindowType: TIME_BASED
        slidingWindowSize: 30
        minimumNumberOfCalls: 20        # 기본 100 → 우리 트래픽엔 너무 큼
        failureRateThreshold: 50
        slowCallDurationThreshold: 1s   # 기본 60s → SLO 기준으로 (8초는 느린 호출)
        slowCallRateThreshold: 50       # 기본 100% → 절반만 느려도 연다
        # waitDurationInOpenState 는 5막 지터(Resilience4jRecoveryConfig.waitIntervalFunctionInOpenState)와
        # 동시 설정 불가(Resilience4j 제약) → 여기선 생략하고 지터 IntervalFunction 으로 대체(30s ±50%)
  # [5막] 회복 직후 결제 경로 유량 제한 — 서킷 닫힌 순간 쌓였던 요청이 한꺼번에 몰리는 2차 부하 차단
  ratelimiter:
    instances:
      pgClient:
        limitForPeriod: 20            # 주기당 허용 호출 수
        limitRefreshPeriod: 1s        # 갱신 주기
        timeoutDuration: 0            # 초과 시 즉시 거절(대기 안 함)
