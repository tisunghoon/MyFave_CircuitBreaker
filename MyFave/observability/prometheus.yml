global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/prometheus-alerts.yml

scrape_configs:
  - job_name: 'myfave-api'
    metrics_path: '/api/v1/actuator/prometheus'
    static_configs:
      # app:8080 = 도커 컨테이너 실행 시 / host.docker.internal:8080 = 로컬 gradlew bootRun(드릴) 스크레이프
      - targets: ['app:8080', 'host.docker.internal:8080']
    relabel_configs:
      - target_label: application
        replacement: myfave-api
