global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'myfave-api'
    scheme: http
    metrics_path: '/api/v1/actuator/prometheus'
    static_configs:
      - targets: ['43.201.206.91:8080']
    relabel_configs:
      - target_label: application
        replacement: myfave-api

  - job_name: 'postgres'
    static_configs:
      - targets: ['myfave-postgres-exporter:9187']
    relabel_configs:
      - target_label: application
        replacement: myfave-db
